# Конфигурация Railway-деплоя.
# .NET: аналог azure.yaml / Aspire AppHost манифеста для облачного хостинга.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Перезапуск при падении — стандартная политика для веб-сервиса
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Liveness-пробник: Railway не маршрутизирует трафик пока не получит 200 OK.
# Используем /health/live (без зависимостей) — иначе Qdrant, которого на Railway сейчас нет,
# валил бы readiness и сервис никогда бы не стартовал.
# .NET: эквивалент livenessProbe в K8s Deployment manifest.
healthcheckPath = "/health/live"
healthcheckTimeout = 30
