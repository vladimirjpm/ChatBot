services:
  # ChatBot.Api — backend на .NET 10 Minimal API + Semantic Kernel.
  # Для локальной разработки; на Railway деплоится отдельно через Dockerfile в корне.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5249:8080"
    environment:
      # PORT и URL Kestrel-а — соответствуют локальному dev-порту 5249
      PORT: "8080"
      ASPNETCORE_ENVIRONMENT: Development
      # Ключ OpenAI берётся из .env / переменной окружения хоста
      Llm__Provider: OpenAI
      Llm__ModelId: gpt-4o
      Llm__ApiKey: ${OPENAI_API_KEY:-}
      # Внутри compose-сети сервисы доступны по имени контейнера
      Qdrant__Host: qdrant
      Qdrant__Port: "6334"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=chatbot;Username=chatbot;Password=chatbot_pass
      ConnectionStrings__Redis: redis:6379
    depends_on:
      - qdrant
      - postgres
      - redis
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
