name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ChatBot.slnx

      - name: Build
        run: dotnet build ChatBot.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ChatBot.slnx --no-build -c Release --logger "console;verbosity=normal"
